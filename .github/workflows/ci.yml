name: CI

on:
  push:
    branches: [main, production-hardening]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Python tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Component tests
        run: npm run test

  browser-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -f Dockerfile.api -t smart-cricket-api:test .
      - name: Start API container
        run: docker run -d --name smart-cricket-api-smoke -p 8000:8000 smart-cricket-api:test
      - name: Wait for API startup
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/smart-cricket-health.json; then
              cat /tmp/smart-cricket-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs smart-cricket-api-smoke
          exit 1
      - name: Readiness smoke
        run: |
          code=$(curl -sS -o /tmp/smart-cricket-ready.json -w "%{http_code}" http://127.0.0.1:8000/ready)
          cat /tmp/smart-cricket-ready.json
          test "$code" = "200"
      - name: Container logs on failure
        if: failure()
        run: docker logs smart-cricket-api-smoke || true
      - name: Stop API container
        if: always()
        run: docker rm -f smart-cricket-api-smoke || true
