services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - smart-cricket-audio:/tmp/smart-cricket-audio
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  smart-cricket-audio:
