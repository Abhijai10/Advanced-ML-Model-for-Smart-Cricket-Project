[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-cricket"
version = "0.15.0"
description = "Smart Cricket video analysis prototype with API, ML inference, and React product UI."
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "ml/src",
  "ml/src/features",
]
testpaths = [
  "backend/api/tests",
  "ml/src",
]
addopts = "-p no:cacheprovider"
markers = [
  "real_e2e: unmocked raw-video inference tests that require a legally usable batting video fixture",
]

[tool.setuptools]
py-modules = []
